<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Redirecting…</title>
  <meta http-equiv="refresh" content="0; url=./#/" />
  <script>
    // Preserve the path as a hash route for GitHub Pages SPA fallback
    (function () {
      var path = location.pathname + location.search;
      var safe = path.replace(/^\/+/, '');
      location.replace('./#/' + safe);
    })();
  </script>
</head>
<body></body>
</html>
